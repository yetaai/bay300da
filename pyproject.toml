[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "bay300-print-agent"
version = "0.1.0"
description = "Headless store-side Bill printing agent for Bay300"
requires-python = ">=3.11"
license = {text = "Proprietary"}
authors = [{name = "Bay300"}]

[project.scripts]
bay300-print-agent = "bay300_print_agent.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
