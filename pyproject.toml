[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "bay300-device-agent"
version = "0.4.4"
description = "Headless capability-scoped store device agent for Bay300"
requires-python = ">=3.11"
license = {text = "Proprietary"}
authors = [{name = "Bay300"}]
dependencies = ["reportlab>=4.2,<5"]

[project.scripts]
bay300da = "bay300_device_agent.cli:main"
bay300-device-agent = "bay300_device_agent.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["bay300_device_agent*"]
